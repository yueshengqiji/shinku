[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinku"
version = "0.1.0"
description = "Local-first memory and context management runtime for AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "yueshengqiji" }]
keywords = ["memory", "context-management", "agent-runtime", "llm", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]

# 依赖只列 B1 真正用到的。C 阶段每接入一个模块，在这里加它需要的那一个依赖，
# 而不是先把旧项目的 requirements.txt 整份搬过来——搬过来等于把还没核验的依赖也带进来。
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",  # C1-3：能力提供方清单是 YAML 文件，本模块是第一个真正解析它的模块
    "tzdata",  # C1-4：公开发言守卫按 Asia/Shanghai 做跨日判定；zoneinfo 在没有系统时区库的
               # 平台（Windows）靠它提供 tzdb。旧项目 requirements.txt 同样是无条件声明。
    "openai",  # C2-2：OpenAI 兼容端点（openai / ollama）复用官方 SDK 造客户端
    "requests",  # C2-2：Anthropic Messages 端点由本仓直发 HTTP，并用 SSE 逐事件解析
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
shinku = "shinku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shinku = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"
